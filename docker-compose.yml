version: '3.8'

services:
  threat_service:
    build:
      context: .
      dockerfile: apps/threat_service/Dockerfile
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://fg_user:fg_pass@postgres:5432/fraudguard
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
    depends_on:
      - postgres

  generator_service:
    build:
      context: .
      dockerfile: apps/generator_service/Dockerfile
    ports:
      - "8002:8000"
    environment:
      - THREAT_SERVICE_URL=http://threat_service:8000
    depends_on:
      - threat_service

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=fg_user
      - POSTGRES_PASSWORD=fg_pass
      - POSTGRES_DB=fraudguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  feature_service:
    # Member 3
    build:
      context: .
      dockerfile: apps/feature_service/Dockerfile
    ports:
      - "8003:8000"

  model_service:
    # Member 4
    build:
      context: .
      dockerfile: apps/model_service/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MEMBER3_FEATURE_SERVICE_URL=http://feature_service:8000
    depends_on:
      - feature_service

  risk_service:
    # Member 5
    build:
      context: .
      dockerfile: apps/risk_service/Dockerfile
    ports:
      - "8005:8000"
    environment:
      - FEATURE_SERVICE_URL=http://feature_service:8000
      - MODEL_SERVICE_URL=http://model_service:8000
      - POLICY_VERSION=v1
    depends_on:
      - feature_service
      - model_service

volumes:
  postgres_data: